# Build settings for the `react-pdf-js` Netlify project (the docs site).
# Build from apps/docs/ where the Astro project lives. The lockfile and
# pnpm-workspace.yaml at the repo root are picked up by pnpm via parent
# traversal during install.

[build]
  base = "apps/docs/"
  command = "pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "11.2.2"
  # In case the legacy Next.js runtime is still installed at the project
  # level, signal that this is no longer a Next.js site.
  NEXT_PLUGIN_SKIP = "true"
  NETLIFY_NEXT_PLUGIN_SKIP = "true"
