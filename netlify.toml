# Build settings for the `react-pdf-js` Netlify project (the docs site).
# Build from the repo root via Turborepo so pnpm picks up the workspace
# config and lockfile, then publish Astro's output from apps/docs/dist.

[build]
  command = "pnpm install --no-frozen-lockfile && pnpm turbo run build --filter=mikecousins-react-pdf-docs"
  publish = "apps/docs/dist"
